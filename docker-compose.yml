version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: askmypdf-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
    volumes:
      - ./server/vector_store:/app/vector_store
      - ./server/uploads:/app/uploads
    env_file:
      - ./server/.env
    depends_on:
      - redis
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: askmypdf-client
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      - NEXT_PUBLIC_API_URL=http://server:3001
      - NODE_ENV=production
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: askmypdf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  vector_store:
  uploads:
  redis_data:

